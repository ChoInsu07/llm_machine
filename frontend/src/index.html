<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Machine</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    const MONACO_CDN = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>LLM Machine</h2>
        <button id="settings-btn" title="Settings">⚙</button>
      </div>

      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="chat">Chat</button>
        <button class="tab-btn" data-tab="files">Files</button>
        <button class="tab-btn" data-tab="diff">Diff</button>
      </div>

      <div class="tab-content active" id="tab-chat">
        <div class="chat-messages" id="chat-messages">
          <div class="message system">
            <div class="msg-content">Welcome! Ask me to write code, fix bugs, or refactor.</div>
          </div>
        </div>
        <div class="chat-input-area">
          <div class="plan-toggle">
            <label><input type="checkbox" id="plan-toggle" checked> Plan mode</label>
          </div>
          <div class="input-row">
            <textarea id="chat-input" rows="3" placeholder="Ask me to do something..."></textarea>
            <button id="chat-send">▶</button>
          </div>
        </div>
      </div>

      <div class="tab-content" id="tab-files">
        <div class="file-tree" id="file-tree">
          <div class="tree-loading">Loading...</div>
        </div>
      </div>

      <div class="tab-content" id="tab-diff">
        <div class="diff-panel">
          <div class="diff-header">
            <select id="diff-file-select"><option value="">Select a file</option></select>
            <button id="diff-refresh">Refresh</button>
          </div>
          <div class="diff-content" id="diff-content">
            <div class="diff-placeholder">Select a file to view diff</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <div class="editor-header">
        <span class="editor-filename" id="editor-filename">Untitled</span>
        <div class="editor-actions">
          <button id="editor-save" title="Save (Cmd+S)">💾 Save</button>
        </div>
      </div>
      <div class="editor-container" id="editor-container"></div>
    </main>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="modal-close" id="settings-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Ollama Host</label>
          <input type="text" id="setting-host" value="http://localhost:11434">
        </div>
        <div class="form-group">
          <label>Model <span id="model-refresh-btn" style="cursor:pointer;font-size:12px;color:#969696;">⟳ refresh</span></label>
          <div class="model-select-area">
            <select id="setting-model" size="6"></select>
            <div class="model-pull-area">
              <input type="text" id="model-pull-input" placeholder="Pull new model...">
              <button id="model-pull-btn">Pull</button>
            </div>
            <div id="model-pull-status"></div>
          </div>
        </div>
        <div class="form-group">
          <label>Workspace Directory</label>
          <input type="text" id="setting-workspace" value=".">
        </div>
      </div>
      <div class="modal-footer">
        <button id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <script src="ui/chat.js"></script>
  <script src="ui/fileExplorer.js"></script>
  <script src="ui/diffViewer.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
